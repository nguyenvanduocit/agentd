name: Release

# Builds, signs, notarizes and publishes a release of agentd with scripts/release.sh, on a macOS runner. Run it by hand
# from main, in the commit that carries the release: app/mygo.json at that version and the pins moved (scripts/pins.sh).
#
#   gh workflow run release.yml -f version=0.7.0                  # builds and checks everything, publishes nothing
#   gh workflow run release.yml -f version=0.7.0 -f publish=true  # the same, then the GitHub release v0.7.0
#
# The signing material is the secrets of the `release` environment, which only main can use: the Developer ID certificate
# and the notary API key (scripts/signing-keychain.sh makes the keychain `mygo build` reads from them), and the two
# private keys release.sh signs the updates with (DAEMON_SIGNING_KEY, APP_UPDATE_KEY). Nothing else runs with them: the
# CI workflow has no access to the environment, and pull requests never start this one. The actions below are pinned
# by commit SHA, since this is the job that holds the keys.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The release, x.y.z
        required: true
        type: string
      publish:
        description: Publish the GitHub release (a tag is final)
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release ${{ inputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    environment: release
    timeout-minutes: 60
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # check-release.sh compares the SDK's sources with the previous release tag
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Make the signing keychain
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: scripts/signing-keychain.sh setup

      - name: Release
        env:
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          DAEMON_SIGNING_KEY_PEM: ${{ secrets.DAEMON_SIGNING_KEY }}
          APP_UPDATE_KEY_VALUE: ${{ secrets.APP_UPDATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          printf '%s\n' "$DAEMON_SIGNING_KEY_PEM" >"$RUNNER_TEMP/daemon-signing.key"
          printf '%s' "$APP_UPDATE_KEY_VALUE" >"$RUNNER_TEMP/mygo-update.key"
          args=("$VERSION")
          if [ "$PUBLISH" = true ]; then args+=(--publish); fi
          DAEMON_SIGNING_KEY="$RUNNER_TEMP/daemon-signing.key" APP_UPDATE_KEY="$RUNNER_TEMP/mygo-update.key" \
            scripts/release.sh "${args[@]}"

      # Run the workflow without publishing first: this is what shows the apps it built are signed, notarized and stapled.
      - name: Check the apps are signed, notarized and stapled
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for arch in arm64 amd64; do
            dir="app/build/darwin-$arch"
            codesign --verify --deep --strict "$dir/agentd.app"
            xcrun stapler validate "$dir/agentd.app"
            xcrun stapler validate "$dir/agentd $VERSION $arch.dmg"
            verdict="$(spctl -a -vv -t exec "$dir/agentd.app" 2>&1)"
            echo "$verdict"
            grep -q 'source=Notarized Developer ID' <<<"$verdict"
            grep -q 'origin=Developer ID Application: Duoc Nguyen (53NJTFJB2R)' <<<"$verdict"
          done

      - name: Remove the signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/daemon-signing.key" "$RUNNER_TEMP/mygo-update.key"
          scripts/signing-keychain.sh teardown
