name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generated:
    name: Generated contract code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./scripts/check-generated.sh

  go:
    name: Go vet, test (daemon, sdk, release server, scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go vet ./...
      - run: go test ./...

  sdk:
    name: SDK typecheck, test, pack
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the last release tag is what the SDK's sources are compared with
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # "A published file never changes": a changed SDK is a new version. The pins of the docs and the example are not
      # checked here, because on main they name the last release by design; scripts/release.sh checks them (scripts/pins.sh).
      - run: ../../scripts/check-release.sh sdk
      - run: ../../scripts/build-sdk.sh "$RUNNER_TEMP/dist"

  app:
    name: App vet, test, cross-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: ../scripts/build-tray.sh "$RUNNER_TEMP/tray"
